name: 打包 Windows beta

# 为什么用 CI 打包：PyInstaller 不能跨平台编译，Windows 的 exe 只能在
# Windows 上生成。这里借 GitHub 的 windows-latest 机器替我们出包，
# 产物直接挂到 Release，本地不需要装任何东西。
on:
  workflow_dispatch:            # 手动触发：Actions 页面点一下，或 gh 命令
    inputs:
      version:
        description: 版本号（用于 zip 文件名，如 0.10.2）
        required: false
        default: "0.11.2"
  push:
    tags: ["v*"]                # 推 tag 时自动出包并上传到对应 Release

permissions:
  contents: write               # 需要写 Release

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 与开发/测试一致的版本

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # 新界面（React）：先装依赖并做类型检查，再构建产物给 PyInstaller 收进去
      - name: 构建新界面（类型检查 + 产物）
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build

      # 交付版本：测试失败必须挡住出包（以前是 continue-on-error，
      # 绿勾不代表测试通过，出现过"测试挂了照样发版"的情况）
      - name: 单元测试（失败即阻断）
        run: python -m unittest discover -s tests -p "test_*.py"

      # 端到端：真前端 + 真 Api + 真流程（Playwright 在真页面里点，Python 干活）
      - name: 端到端（真前端 + 真 Api）
        run: |
          npx --prefix web playwright install chromium
          python scripts/dev/run_ui_e2e.py

      # 一键制作更新包：真前端 + 真 Api + 真磁盘，从实例目录导出并读回产物
      - name: 端到端（本地实例一键制作更新包）
        env:
          PYTHON: python
        run: |
          python scripts/dev/make_export_fixture.py export-fixture
          node scripts/dev/e2e_export.mjs --instance export-fixture/DemoPack --out export-out/DemoPack.eapack --port 8141 --min-index 1

      # GitHub 的 runner 镜像里没有 WebView2 运行时（只有 Edge 浏览器），先装上
      - name: 安装 WebView2 运行时
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebView2Setup.exe"
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $exe
              break
            } catch { Write-Host "下载 WebView2 安装器失败（第 $i 次）：$_"; Start-Sleep -Seconds 5 }
          }
          if (-not (Test-Path $exe)) { throw "拿不到 WebView2 安装器" }
          $proc = Start-Process -FilePath $exe -ArgumentList "/silent", "/install" -Wait -PassThru
          Write-Host "安装器退出码：$($proc.ExitCode)"
          $found = @()
          foreach ($base in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
            if (-not $base) { continue }
            $app = Join-Path $base "Microsoft\EdgeWebView\Application"
            if (Test-Path $app) {
              $found += $app
              Get-ChildItem $app | Select-Object FullName
            }
          }
          if ($found.Count -eq 0) {
            Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\*" -ErrorAction SilentlyContinue |
              Select-Object name, pv | Format-Table | Out-String | Write-Host
            throw "WebView2 运行时没装上（两个 Program Files 下都没有 EdgeWebView\Application）"
          }

      # 真机端到端（源码壳）：真 WebView2 + 真前端 + 真磁盘，覆盖全部功能
      # 真 WebView2 的完整功能套件：本仓库在这台 runner 上约一半概率遇到
      # "WebView2 不加载页面"（同样的 exe 在打包冒烟里能起来），所以只留证据。
      # 产品侧的阻断判据是最后那条"打包后起窗冒烟（默认路径）"。
      - name: 真机端到端（源码，仅供参考）
        continue-on-error: true
        timeout-minutes: 25
        shell: pwsh
        env:
          PULSES_E2E_TIMEOUT: "600"
        run: |
          python tests/web_e2e_windows.py
          Write-Host "源码壳 e2e 退出码：$LASTEXITCODE"

      # 真实 Tk 窗口：动画 / 文字刷新 / 列表增量 / 滚动位置
      # （没有桌面时脚本自己跳过，不会误伤）
      - name: 真实 GUI 冒烟（失败即阻断）
        run: python tests/gui_smoke.py

      - name: PyInstaller 打包
        run: python -m PyInstaller --clean --noconfirm pulses-easier.spec

      - name: 打包产物结构（诊断用）
        shell: pwsh
        run: |
          Get-ChildItem "dist/Pulses Easier" -Force | Select-Object Name | Format-Table
          if (Test-Path "dist/Pulses Easier/web") {
            Get-ChildItem "dist/Pulses Easier/web" -Recurse -Depth 2 | Select-Object FullName
          }
          if (Test-Path "dist/Pulses Easier/_internal/web") {
            Get-ChildItem "dist/Pulses Easier/_internal/web" -Recurse -Depth 2 | Select-Object FullName
          }

      # 真机端到端（打包壳）：和第 9 步同一套断言，跑的是 dist 里的 exe
      # 打包壳里跑完整 e2e：目前在这条流水线环境里会卡在起窗后（同一个 Python/JS
      # 代码在源码壳里全绿），先只留证据、不阻断；产品侧真正的阻断判据在下一步。
      - name: 打包后真机端到端（新界面，仅供参考）
        continue-on-error: true
        timeout-minutes: 25
        shell: pwsh
        env:
          PULSES_E2E_TIMEOUT: "600"
        run: |
          python tests/web_e2e_windows.py --exe "dist/Pulses Easier/Pulses Easier.exe"
          Write-Host "打包壳 e2e 退出码：$LASTEXITCODE"

      # 默认启动路径：不设 PULSES_UI，玩家双击就是这个行为
      # 判据：窗口出现 + 页面就绪（page-ready）。WebView2 在这台 runner 上偶发
      # 不加载页面，所以给三次机会；真 bug 三次都过不了。
      - name: 打包后起窗冒烟（默认路径，失败即阻断）
        shell: pwsh
        timeout-minutes: 15
        run: |
          $exe = "dist/Pulses Easier/Pulses Easier.exe"
          $log = Join-Path $env:RUNNER_TEMP "web-start.log"
          $env:PULSES_WEB_LOG = $log
          Remove-Item Env:PULSES_UI -ErrorAction SilentlyContinue
          for ($try = 1; $try -le 3; $try++) {
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -PassThru
            $title = ""
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              $p.Refresh()
              if ($p.HasExited) { break }
              if ($p.MainWindowTitle) { $title = $p.MainWindowTitle; break }
            }
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern "page-ready" -Quiet)) {
                $ready = $true; break
              }
              if ($p.HasExited) { break }
              Start-Sleep -Seconds 1
            }
            if (Test-Path $log) { Write-Host "--- 第 $try 次启动留痕 ---"; Get-Content $log | Write-Host }
            if (-not $p.HasExited) {
              try {
                Add-Type -AssemblyName System.Windows.Forms, System.Drawing
                $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
                $g = [System.Drawing.Graphics]::FromImage($bmp)
                $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
                $bmp.Save((Join-Path $env:RUNNER_TEMP "web-preview.png"),
                          [System.Drawing.Imaging.ImageFormat]::Png)
                Copy-Item (Join-Path $env:RUNNER_TEMP "web-preview.png") "web-preview.png" -Force
              } catch { Write-Host "截图失败：$_" }
              Stop-Process -Id $p.Id -Force
            }
            if ($title -and $ready) {
              Write-Host "通过：窗口标题 '$title'，页面就绪（第 $try 次）"
              exit 0
            }
            Write-Host "第 $try 次未通过（title='$title' ready=$ready）"
            Start-Sleep -Seconds 5
          }
          throw "打包后起窗冒烟三次都没通过"

      - name: 上传新界面截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: web-preview.png
          if-no-files-found: ignore

      - name: 保存端到端截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            e2e-ui.png
            e2e-windows.png
          if-no-files-found: ignore

      - name: 组装发布目录 + 压缩
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.6.1" }
          $out = "pulses-easier-$ver-beta-win64"
          New-Item -ItemType Directory -Force -Path "dist/$out" | Out-Null
          Copy-Item -Recurse -Force "dist/Pulses Easier/*" "dist/$out/"
          # assets 复制到 exe 同级：程序优先读这一份，玩家能直接换 logo
          Copy-Item -Recurse -Force "assets" "dist/$out/assets"
          New-Item -ItemType Directory -Force -Path "dist/$out/logs" | Out-Null
          "" | Set-Content "dist/$out/logs/.keep"
          Copy-Item -Force README.md, CHANGELOG.md "dist/$out/"
          Compress-Archive -Path "dist/$out/*" -DestinationPath "dist/$out.zip" -Force
          Write-Host "产物：dist/$out.zip"
          Get-Item "dist/$out.zip" | Select-Object Name, Length

      - name: 上传产物（每次运行都能下载）
        uses: actions/upload-artifact@v4
        with:
          name: pulses-easier-windows-beta
          path: dist/*.zip
          if-no-files-found: error

      - name: 挂到 Release（推 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
